<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Valentine 💖</title>

<style>
body {
    margin: 0;
    height: 100vh;
    font-family: Arial, sans-serif;
    overflow: hidden;
}

/* ---------- BACKGROUND CROSSFADE ---------- */
#bg, #bg2 {
    position: fixed;
    inset: 0;
    background-size: cover;
    background-position: center;
    transition: opacity 1.5s ease-in-out;
    z-index: 0;
}

#bg2 {
    opacity: 0;
}

/* Dark overlay */
#overlay {
    position: fixed;
    inset: 0;
    background: rgba(0,0,0,0.35);
    z-index: 1;
}

/* Question */
h1 {
    position: absolute;
    top: 20%;
    width: 100%;
    text-align: center;
    font-size: 3rem;
    color: white;
    z-index: 2;
}

/* Buttons */
button {
    padding: 25px 60px;
    font-size: 1.8rem;
    border-radius: 50px;
    border: none;
    cursor: pointer;
    text-transform: uppercase;
    z-index: 2;
}

#yes {
    position: absolute;
    top: 55%;
    left: 40%;
    transform: translate(-50%, -50%);
    background: #ff2e63;
    color: white;
}

#no {
    position: absolute;
    top: 55%;
    left: 60%;
    transform: translate(-50%, -50%);
    background: #444;
    color: white;
}

/* Video overlay */
#videoContainer {
    display: none;
    position: fixed;
    inset: 0;
    background: black;
    justify-content: center;
    align-items: center;
    z-index: 4;
}

video {
    width: 90%;
    max-width: 900px;
    border-radius: 20px;
}

/* Falling hearts & roses */
.fall {
    position: fixed;
    top: -50px;
    animation: fall linear forwards;
    pointer-events: none;
    z-index: 5;
}

@keyframes fall {
    to {
        transform: translateY(110vh) rotate(360deg);
        opacity: 0;
    }
}
</style>
</head>

<body>

<div id="bg"></div>
<div id="bg2"></div>
<div id="overlay"></div>

<h1 id="question">Vaishuuu....Will you be my Valentine? 💘</h1>

<button id="yes">YES</button>
<button id="no">NO</button>

<div id="videoContainer">
    <video id="valentineVideo" controls autoplay>
        <source src="Vaishu.mp4" type="video/mp4">
    </video>
</div>

<script>
/* ---------- BACKGROUND SLIDESHOW ---------- */
const backgrounds = [
    "bg1.jpeg","bg2.jpeg","bg3.jpeg","bg4.jpeg","bg5.jpeg",
    "bg6.jpeg","bg7.jpeg","bg8.jpeg","bg9.jpeg","bg10.jpeg","bg11.jpeg"
];

backgrounds.sort(() => Math.random() - 0.5);

let bgIndex = 1;
let showingBg1 = true;

const bg = document.getElementById("bg");
const bg2 = document.getElementById("bg2");

bg.style.backgroundImage = `url(${backgrounds[0]})`;
bg.style.opacity = 1;

function changeBackground() {
    const nextImage = backgrounds[bgIndex];

    if (showingBg1) {
        bg2.style.backgroundImage = `url(${nextImage})`;
        bg2.style.opacity = 1;
        bg.style.opacity = 0;
    } else {
        bg.style.backgroundImage = `url(${nextImage})`;
        bg.style.opacity = 1;
        bg2.style.opacity = 0;
    }

    showingBg1 = !showingBg1;
    bgIndex = (bgIndex + 1) % backgrounds.length;
}

let bgInterval;
setTimeout(() => {
    changeBackground();
    bgInterval = setInterval(changeBackground, 2500);
}, 2500);

/* ---------- NO BUTTON TELEPORT ---------- */
const noBtn = document.getElementById("no");
const yesBtn = document.getElementById("yes");
const question = document.getElementById("question");
const videoContainer = document.getElementById("videoContainer");
const video = document.getElementById("valentineVideo");

let teleportActivated = false;

function teleportNo() {
    const pad = 20;
    const x = Math.random() * (window.innerWidth - noBtn.offsetWidth - pad);
    const y = Math.random() * (window.innerHeight - noBtn.offsetHeight - pad);
    noBtn.style.left = x + "px";
    noBtn.style.top = y + "px";
    noBtn.style.transform = "none";
}

["mouseenter","touchstart"].forEach(evt => {
    noBtn.addEventListener(evt, () => {
        teleportActivated = true;
        teleportNo();
    }, { once: true });
});

["mouseenter","mousedown","touchstart"].forEach(evt => {
    noBtn.addEventListener(evt, () => {
        if (teleportActivated) teleportNo();
    });
});

/* ---------- CELEBRATION ---------- */
function createCelebration() {
    const el = document.createElement("div");
    el.className = "fall";
    el.innerText = Math.random() > 0.5 ? "💖" : "🌹";
    el.style.left = Math.random() * window.innerWidth + "px";
    el.style.fontSize = (20 + Math.random() * 30) + "px";
    el.style.animationDuration = (3 + Math.random() * 3) + "s";
    document.body.appendChild(el);
    setTimeout(() => el.remove(), 6000);
}

/* ---------- YES CLICK ---------- */
yesBtn.addEventListener("click", () => {
    clearInterval(bgInterval);

    question.style.display = "none";
    yesBtn.style.display = "none";
    noBtn.style.display = "none";

    videoContainer.style.display = "flex";
    video.play();

    setInterval(createCelebration, 150);
});
</script>

</body>
</html>
