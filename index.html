<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Valentine 💖</title>

<style>
body {
    margin: 0;
    height: 100vh;
    font-family: Arial, sans-serif;
    overflow: hidden;
}

/* Background slideshow */
#bg {
    position: fixed;
    inset: 0;
    background-size: cover;
    background-position: center;
    transition: opacity 1.5s ease-in-out;
    z-index: 0;
}

#overlay {
    position: fixed;
    inset: 0;
    background: rgba(0,0,0,0.35);
    z-index: 1;
}

/* Question */
h1 {
    position: absolute;
    top: 20%;
    width: 100%;
    text-align: center;
    font-size: 3rem;
    color: white;
    z-index: 2;
}

/* Buttons */
button {
    padding: 25px 60px;
    font-size: 1.8rem;
    border-radius: 50px;
    border: none;
    cursor: pointer;
    text-transform: uppercase;
    z-index: 2;
}

#yes {
    position: absolute;
    top: 55%;
    left: 45%;
    transform: translate(-50%, -50%);
    background: #ff2e63;
    color: white;
}

#no {
    position: absolute;
    top: 55%;
    left: 55%;
    transform: translate(-50%, -50%);
    background: #444;
    color: white;
}

/* Video overlay – HIDDEN BY DEFAULT */
#videoContainer {
    display: none;
    position: fixed;
    inset: 0;
    background: black;
    justify-content: center;
    align-items: center;
    z-index: 10;
}

video {
    width: 90%;
    max-width: 900px;
    border-radius: 20px;
}

/* Falling emojis */
.fall {
    position: fixed;
    top: -50px;
    animation: fall linear forwards;
    pointer-events: none;
    z-index: 20;
}

@keyframes fall {
    to {
        transform: translateY(110vh) rotate(360deg);
        opacity: 0;
    }
}
</style>
</head>

<body>

<div id="bg"></div>
<div id="overlay"></div>

<h1 id="question">Will you be my Valentine? 💘</h1>

<button id="yes">YES</button>
<button id="no">NO</button>

<div id="videoContainer">
    <video id="valentineVideo" controls>
        <source src="Vaishu.mp4" type="video/mp4">
    </video>
</div>

<script>
/* -------- BACKGROUND SLIDESHOW -------- */
const backgrounds = [
  "bg1.jpeg","bg2.jpeg","bg3.jpeg","bg4.jpeg","bg5.jpeg",
  "bg6.jpeg","bg7.jpeg","bg8.jpeg","bg9.jpeg","bg10.jpeg","bg11.jpeg"
];

let bgIndex = 0;
const bg = document.getElementById("bg");

function changeBg() {
  bg.style.opacity = 0;
  setTimeout(() => {
    bg.style.backgroundImage = `url(${backgrounds[bgIndex]})`;
    bg.style.opacity = 1;
    bgIndex = (bgIndex + 1) % backgrounds.length;
  }, 800);
}

bg.style.backgroundImage = `url(${backgrounds[0]})`;
setInterval(changeBg, 6000);

/* -------- NO BUTTON -------- */
const noBtn = document.getElementById("no");
let activated = false;

function moveNo() {
  const x = Math.random() * (window.innerWidth - noBtn.offsetWidth);
  const y = Math.random() * (window.innerHeight - noBtn.offsetHeight);
  noBtn.style.left = x + "px";
  noBtn.style.top = y + "px";
  noBtn.style.transform = "none";
}

["mouseenter","touchstart"].forEach(e =>
  noBtn.addEventListener(e, () => {
    activated = true;
    moveNo();
  }, { once:true })
);

["mouseenter","mousedown","touchstart"].forEach(e =>
  noBtn.addEventListener(e, () => activated && moveNo())
);

/* -------- CELEBRATION -------- */
function celebrate() {
  const el = document.createElement("div");
  el.className = "fall";
  el.innerText = Math.random() > 0.5 ? "💖" : "🌹";
  el.style.left = Math.random() * window.innerWidth + "px";
  el.style.fontSize = (20 + Math.random()*30) + "px";
  el.style.animationDuration = (3 + Math.random()*3) + "s";
  document.body.appendChild(el);
  setTimeout(() => el.remove(), 6000);
}

/* -------- YES CLICK -------- */
document.getElementById("yes").addEventListener("click", () => {
  document.getElementById("question").style.display = "none";
  document.getElementById("yes").style.display = "none";
  document.getElementById("no").style.display = "none";

  document.getElementById("videoContainer").style.display = "flex";
  document.getElementById("valentineVideo").play();

  setInterval(celebrate, 150);
});
</script>

</body>
</html>
